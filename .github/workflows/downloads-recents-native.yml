name: Downloads native Android reopen regression
on:
  push:
    branches: ['fix/downloads-recents-v229-*']
    paths:
      - 'apps/MarkdownDesk/**'
      - 'verification/downloads_browser/**'
      - '.github/workflows/downloads-recents-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: md-downloads-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - name: Provision Android SDK37 and API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?missing runner SDK}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Compile and build unsigned candidate
        env:
          ANDROID_PLATFORM: android-37.0
          ANDROID_BUILD_TOOLS: '36.0.0'
        run: |
          set -euo pipefail
          bash verification/downloads_browser/run.sh
          bash apps/MarkdownDesk/build.sh --unsigned Downloads-native-test
      - name: Sign only for disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/downloads-emulator-only.jks"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$KEY" -storepass android -alias smoke -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Disposable Android emulator fixture"
          OUT="$RUNNER_TEMP/Downloads-EMULATOR-ONLY.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke --out "$OUT" apps/MarkdownDesk/build/Downloads-native-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$OUT"
          echo "SMOKE_APK=$OUT" >> "$GITHUB_ENV"
      - name: Start isolated Android 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/md-downloads-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n md-downloads -p "$ANDROID_AVD_HOME/md-downloads.avd" -k "system-images;android-35;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd md-downloads -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 150 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 480 bash -c 'while [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != 1 ]; do sleep 4; done' _ "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
      - name: Test native browse, persistent Recents and revoke
        shell: bash
        run: |
          set -euo pipefail
          export ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install --no-streaming "$SMOKE_APK"
          python3 verification/downloads_browser/native_reopen.py
          echo 'Native Android Downloads browse/restart/revoke PASS (test-signed emulator only).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical signing, original data upgrade and physical Fold7 NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve nonsecret emulator diagnostics on failure
        if: failure()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" exec-out uiautomator dump /dev/tty > "$RUNNER_TEMP/final-ui.txt" 2>&1 || true
          "$ANDROID_HOME/platform-tools/adb" logcat -d -t 400 > "$RUNNER_TEMP/logcat-tail.txt" 2>&1 || true
      - name: Upload diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: downloads-emulator-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/final-ui.txt
            ${{ runner.temp }}/logcat-tail.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 3
