name: Host regression and safety gates
on:
  pull_request:
    paths:
      - 'apps/MarkdownDesk/src/**'
      - 'apps/MarkdownDesk/test/**'
      - 'shared/**'
      - 'verification/**'
      - '.github/workflows/host-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Provision pinned host-only JSON dependency
        run: bash verification/setup_host_deps.sh
      - name: Behavioral preservation checks
        run: bash verification/run_host_checks.sh
      - name: Desired safety gate (must fail while provider-loss defects persist)
        run: bash verification/run_safety_gates.sh
