name: Markdown Desk unsigned rescue build proof

on:
  push:
    branches:
      - 'rescue/md-unsigned-build-proof-*'
    paths:
      - 'apps/MarkdownDesk/**'
      - 'shared/**'
      - 'verification/**'
      - '.github/workflows/unsigned-rescue-proof.yml'

concurrency:
  group: markdown-desk-rescue-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsigned-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Install Android packaging tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Runner Android SDK not available}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build unsigned validation APK only
        env:
          ANDROID_PLATFORM: android-37.0
          ANDROID_BUILD_TOOLS: '36.0.0'
        run: bash apps/MarkdownDesk/build.sh --unsigned MarkdownDesk-unsigned-proof

      - name: Verify package and checksum without signing
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/MarkdownDesk/build/MarkdownDesk-unsigned-proof.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "name='com.example.markdowndesk'" "$RUNNER_TEMP/badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/unsigned-sha256.txt"
          echo "UNSIGNED source/build proof, not release-approved and not a phone-installable update" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain unsigned proof for readback
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: markdown-desk-unsigned-proof-${{ github.sha }}
          path: apps/MarkdownDesk/build/MarkdownDesk-unsigned-proof.apk
          if-no-files-found: error
          retention-days: 7

      - name: Provide host fixture discovery tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep
          rg --version

      - name: Provision pinned host test dependencies
        shell: bash
        run: bash verification/setup_host_deps.sh

      - name: Verify broad owner-scoped current-phone host suite
        shell: bash
        run: |
          set -euo pipefail
          bash verification/run_current_phone_checks.sh
          echo 'Full current-phone host source suite PASS if this step succeeds. 18 owner-deferred portable-private-state suites explicitly NOT RUN. Native Fold7/provider/release signing NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
