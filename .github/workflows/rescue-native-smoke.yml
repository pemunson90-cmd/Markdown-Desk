name: Markdown Desk isolated Android emulator smoke

on:
  push:
    branches:
      - 'rescue/md-unsigned-build-proof-*'
    paths:
      - 'apps/MarkdownDesk/**'
      - 'shared/**'
      - 'verification/tab_switch_native/**'
      - '.github/workflows/rescue-native-smoke.yml'

permissions:
  contents: read

concurrency:
  group: markdown-desk-native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Provision Android SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK unavailable}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Build unsigned source candidate
        env:
          ANDROID_PLATFORM: android-37.0
          ANDROID_BUILD_TOOLS: '36.0.0'
        run: bash apps/MarkdownDesk/build.sh --unsigned MarkdownDesk-native-smoke-unsigned

      - name: Generate disposable emulator-only test key and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          # This temporary test identity is not the canonical release signer.
          # Its generated key remains only in the ephemeral runner's temp directory.
          KEY="$RUNNER_TEMP/emulator-only-debug.jks"
          APK="apps/MarkdownDesk/build/MarkdownDesk-native-smoke-unsigned.apk"
          OUT="$RUNNER_TEMP/MarkdownDesk-EMULATOR-ONLY.apk"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$KEY" -storepass android \
            -alias smoke -keypass android -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Ephemeral emulator smoke, O=Local verification"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEY" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke \
            --out "$OUT" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$OUT"
          echo "SMOKE_APK=$OUT" >> "$GITHUB_ENV"
          echo 'Ephemeral test signing only; not installable over the user release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM and create isolated emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/md-smoke-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n md-smoke -p "$ANDROID_AVD_HOME/md-smoke.avd" \
            -k "system-images;android-35;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd md-smoke -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on \
            > "$RUNNER_TEMP/md-emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 150 "$ADB" wait-for-device
          timeout 480 bash -c '
            while [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 4; done
          ' _ "$ADB"
          "$ADB" shell getprop ro.build.version.sdk
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0

      - name: Install, launch, rotate and cold-relaunch genuine Android app
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install --no-streaming "$SMOKE_APK"
          "$ADB" shell pm path com.example.markdowndesk
          "$ADB" shell am start -W -n com.example.markdowndesk/.MainActivity
          sleep 5
          "$ADB" shell pidof com.example.markdowndesk
          "$ADB" shell screencap -p /sdcard/md-portrait.png
          "$ADB" pull /sdcard/md-portrait.png "$RUNNER_TEMP/md-portrait.png" >/dev/null
          "$ADB" shell settings put system accelerometer_rotation 0
          "$ADB" shell settings put system user_rotation 1
          sleep 3
          "$ADB" shell pidof com.example.markdowndesk
          "$ADB" shell screencap -p /sdcard/md-landscape.png
          "$ADB" pull /sdcard/md-landscape.png "$RUNNER_TEMP/md-landscape.png" >/dev/null
          "$ADB" shell settings put system user_rotation 0
          # Force a real portrait viewport for Workspace interaction tests.
          # The hosted emulator otherwise remains 640x320 despite user_rotation=0;
          # swipes starting at y490 were outside its physical display.
          "$ADB" shell wm size 360x800
          sleep 3
          "$ADB" shell am force-stop com.example.markdowndesk
          "$ADB" shell am start -W -n com.example.markdowndesk/.MainActivity
          sleep 3
          "$ADB" shell pidof com.example.markdowndesk
          "$ADB" shell uiautomator dump /sdcard/md-window.xml >/dev/null
          "$ADB" pull /sdcard/md-window.xml "$RUNNER_TEMP/md-window.xml" >/dev/null
          "$ADB" shell wm size
          "$ADB" shell screencap -p /sdcard/md-portrait-check.png
          "$ADB" pull /sdcard/md-portrait-check.png "$RUNNER_TEMP/md-portrait-check.png" >/dev/null
          python3 - "$RUNNER_TEMP/md-portrait-check.png" <<'PY'
          import struct,sys
          with open(sys.argv[1],"rb") as f:
              header=f.read(24)
          if header[:8]!=bytes([137,80,78,71,13,10,26,10]):
              raise SystemExit("No PNG from emulator")
          width,height=struct.unpack(">II",header[16:24])
          if height<=width or height<490:
              raise SystemExit(f"Workspace smoke requires portrait display, got {width}x{height}")
          print(f"PASS portrait emulator display {width}x{height}")
          PY
          # Press the real visible Workspace control by its accessibility bounds.
          # No hard-coded UI coordinates or screenshots-as-test assertions.
          WORKSPACE_TAP="$(python3 - "$RUNNER_TEMP/md-window.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          matches=[n for n in root.iter("node") if n.get("text")=="Files"]
          if len(matches)!=1: raise SystemExit("Files entrypoint absent or ambiguous")
          bounds=matches[0].get("bounds","")
          groups=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",bounds)
          if groups is None: raise SystemExit("Workspace bounds unavailable")
          a,b,c,d=map(int,groups.groups())
          print((a+c)//2,(b+d)//2)
          PY
          )"
          "$ADB" shell input tap $WORKSPACE_TAP
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/md-workspace.xml >/dev/null
          "$ADB" pull /sdcard/md-workspace.xml "$RUNNER_TEMP/md-workspace.xml" >/dev/null
          "$ADB" shell screencap -p /sdcard/md-workspace.png
          "$ADB" pull /sdcard/md-workspace.png "$RUNNER_TEMP/md-workspace.png" >/dev/null
          # Android's UI hierarchy exposes the currently visible scroll viewport,
          # not every offscreen Workspace entry. Inspect each real swipe page.
          for PAGE in 1 2 3 4 5; do
            "$ADB" shell input swipe 160 490 160 200 380
            sleep 1
            "$ADB" shell uiautomator dump /sdcard/md-workspace-page.xml >/dev/null
            "$ADB" pull /sdcard/md-workspace-page.xml "$RUNNER_TEMP/md-workspace-page-$PAGE.xml" >/dev/null
          done
          "$ADB" shell screencap -p /sdcard/md-workspace-bottom.png
          "$ADB" pull /sdcard/md-workspace-bottom.png "$RUNNER_TEMP/md-workspace-bottom.png" >/dev/null
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as ET
          directory=pathlib.Path(sys.argv[1])
          pages=[directory/"md-workspace.xml"]+sorted(directory.glob("md-workspace-page-*.xml"))
          labels=[]
          for page in pages:
              labels.extend(n.get("text","") for n in ET.parse(page).getroot().iter("node"))
          expected=("Files","Open a file","New document","Open tabs","Favorites","Folders")
          for value in expected:
              if not any(value in label for label in labels):
                  raise SystemExit("Native Workspace UI missing after scroll: "+value)
          print("PASS native Files hub destinations are scroll-reachable")
          PY
          # Click only by a visible accessibility text/bounds pair, not guesswork.
          tap_native_label() {
            local xml="$1" text="$2" coordinates
            coordinates="$(python3 - "$xml" "$text" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot();phrase=sys.argv[2]
          items=[n for n in root.iter("node") if phrase in n.get("text","")
                 and (phrase!="Manage favorites" or "Browse or remove" in n.get("content-desc",""))]
          if len(items)!=1:raise SystemExit("Visible clickable label missing/ambiguous: "+phrase)
          pattern=r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]"
          match=re.fullmatch(pattern,items[0].get("bounds",""))
          if not match:raise SystemExit("No visible tap bounds: "+phrase)
          a,b,c,d=map(int,match.groups());print((a+c)//2,(b+d)//2)
          PY
            )"
            "$ADB" shell input tap $coordinates
          }
          dump_native_state() {
            local id="$1"
            sleep 2
            "$ADB" shell uiautomator dump /sdcard/md-native-check.xml >/dev/null
            "$ADB" pull /sdcard/md-native-check.xml "$RUNNER_TEMP/md-$id.xml" >/dev/null
            "$ADB" shell screencap -p /sdcard/md-native-check.png
            "$ADB" pull /sdcard/md-native-check.png "$RUNNER_TEMP/md-$id.png" >/dev/null
          }
          check_native_text() {
            python3 - "$1" "$2" <<'PY'
          import sys,xml.etree.ElementTree as ET
          labels=[n.get("text","") for n in ET.parse(sys.argv[1]).getroot().iter("node")]
          if not any(sys.argv[2] in x for x in labels):
              raise SystemExit("Expected native UI message absent: "+sys.argv[2])
          PY
          }
          # Verify the Files destination actually launches the preserved
          # Favorites screen. Other editing and storage tools live in More.
          "$ADB" shell input keyevent KEYCODE_BACK
          sleep 1
          "$ADB" shell input tap $WORKSPACE_TAP
          dump_native_state "workspace-reopen"
          tap_native_label "$RUNNER_TEMP/md-workspace-reopen.xml" "Manage favorites"
          dump_native_state "favorites-empty"
          check_native_text "$RUNNER_TEMP/md-favorites-empty.xml" "No favorites yet"
          echo "PASS native Files chooser and Favorites destination; source file untouched." >> "$GITHUB_STEP_SUMMARY"
          echo 'Bookmark selection, open-provider URI, and More menu: NOT RUN in this focused native navigation smoke; separately tested source paths.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS: emulator installed/test-signed candidate, launched, survived rotation and cold relaunch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS: native Files hub and Favorites destination available on portrait Android.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT RUN: Fold7, user data migration, Android SAF third-party providers, TalkBack, release certificate/signing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Read mode font controls remain correctly labeled
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_BACK
          "$ADB" shell wm size 360x800
          "$ADB" shell uiautomator dump /sdcard/md-before-read.xml >/dev/null
          "$ADB" pull /sdcard/md-before-read.xml "$RUNNER_TEMP/md-before-read.xml" >/dev/null
          READ_TAP="$(python3 - "$RUNNER_TEMP/md-before-read.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          nodes=[n for n in ET.parse(sys.argv[1]).getroot().iter("node")
                 if n.get("text")=="Read" and n.get("clickable")=="true"]
          if len(nodes)!=1:raise SystemExit("Read mode button missing or ambiguous")
          m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",nodes[0].get("bounds",""))
          if not m:raise SystemExit("Read bounds invalid")
          a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2)
          PY
          )"
          "$ADB" shell input tap $READ_TAP
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/md-read-toolbar.xml >/dev/null
          "$ADB" pull /sdcard/md-read-toolbar.xml "$RUNNER_TEMP/md-read-toolbar.xml" >/dev/null
          python3 - "$RUNNER_TEMP/md-read-toolbar.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          labels=[n.get("text","") for n in ET.parse(sys.argv[1]).getroot().iter("node")]
          for expected in ("A−","A+"):
              if expected not in labels:raise SystemExit("Read font control mislabeled/missing: "+expected)
          print("PASS Read mode A− / A+ labels remain bound to font actions")
          PY
          echo 'PASS Read typography control labels; physical Fold7 still NOT RUN' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify expanded Files rail and Back without replacing editor
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Close any focused dialog; this is a disposable emulator with no user files.
          "$ADB" shell input keyevent KEYCODE_BACK
          "$ADB" shell wm density 160
          "$ADB" shell wm size 1280x960
          "$ADB" shell am force-stop com.example.markdowndesk
          "$ADB" shell am start -W -n com.example.markdowndesk/.MainActivity
          sleep 5
          "$ADB" shell pidof com.example.markdowndesk
          "$ADB" shell uiautomator dump /sdcard/md-expanded-before.xml >/dev/null
          "$ADB" pull /sdcard/md-expanded-before.xml "$RUNNER_TEMP/md-expanded-before.xml" >/dev/null
          FILES_TAP="$(python3 - "$RUNNER_TEMP/md-expanded-before.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          nodes=[n for n in ET.parse(sys.argv[1]).getroot().iter("node") if n.get("text")=="Files"]
          if len(nodes)!=1: raise SystemExit("Expanded Files entrypoint missing/ambiguous")
          match=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",nodes[0].get("bounds",""))
          if not match: raise SystemExit("No expanded Files button bounds")
          x1,y1,x2,y2=map(int,match.groups());print((x1+x2)//2,(y1+y2)//2)
          PY
          )"
          "$ADB" shell input tap $FILES_TAP
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/md-expanded-rail.xml >/dev/null
          "$ADB" pull /sdcard/md-expanded-rail.xml "$RUNNER_TEMP/md-expanded-rail.xml" >/dev/null
          "$ADB" shell screencap -p /sdcard/md-expanded-rail.png
          "$ADB" pull /sdcard/md-expanded-rail.png "$RUNNER_TEMP/md-expanded-rail.png" >/dev/null
          python3 - "$RUNNER_TEMP/md-expanded-rail.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          nodes=list(ET.parse(sys.argv[1]).getroot().iter("node"))
          labels=[n.get("text","") for n in nodes]
          for expected in ("Open a file","New document","Favorites","Folders"):
              matches=[n for n in nodes if expected in n.get("text","")]
              if len(matches)!=1: raise SystemExit("Expanded Files rail item missing/ambiguous: "+expected)
              bounds=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",matches[0].get("bounds",""))
              if not bounds or int(bounds.group(3))>400:
                  raise SystemExit("Files destination is not contained in left rail: "+expected)
          if any("Back to editor" in label for label in labels):
              raise SystemExit("Expanded Files opened compact dialog instead of rail")
          print("PASS expanded real Android Files rail on left beside editor")
          PY
          "$ADB" shell input keyevent KEYCODE_BACK
          sleep 2
          "$ADB" shell pidof com.example.markdowndesk
          "$ADB" shell uiautomator dump /sdcard/md-expanded-back.xml >/dev/null
          "$ADB" pull /sdcard/md-expanded-back.xml "$RUNNER_TEMP/md-expanded-back.xml" >/dev/null
          python3 - "$RUNNER_TEMP/md-expanded-back.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          labels=[n.get("text","") for n in ET.parse(sys.argv[1]).getroot().iter("node")]
          if any("Open a file" in label for label in labels):
              raise SystemExit("Back did not close expanded Files rail")
          if labels.count("Files")!=1: raise SystemExit("Back lost the editor's Files control")
          print("PASS Back closes expanded Files rail without exiting app")
          PY
          echo 'PASS: expanded Android width Files rail and Back; actual Fold7 still NOT RUN.' >> "$GITHUB_STEP_SUMMARY"

      - name: Reproduce rapid native tab switching and restore session
        shell: bash
        run: bash verification/tab_switch_native/run.sh

      - name: Retain emulator evidence only (no distributable APK)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: markdown-desk-native-smoke-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/md-emulator.log
            ${{ runner.temp }}/md-tab-switch/*.xml
            ${{ runner.temp }}/md-tab-switch/logcat.txt
            ${{ runner.temp }}/md-portrait.png
            ${{ runner.temp }}/md-portrait-check.png
            ${{ runner.temp }}/md-landscape.png
            ${{ runner.temp }}/md-before-read.xml
            ${{ runner.temp }}/md-read-toolbar.xml
            ${{ runner.temp }}/md-expanded-before.xml
            ${{ runner.temp }}/md-expanded-rail.xml
            ${{ runner.temp }}/md-expanded-back.xml
            ${{ runner.temp }}/md-expanded-rail.png
            ${{ runner.temp }}/md-window.xml
            ${{ runner.temp }}/md-workspace.xml
            ${{ runner.temp }}/md-workspace.png
            ${{ runner.temp }}/md-workspace-bottom.png
            ${{ runner.temp }}/md-workspace-page-*.xml
            ${{ runner.temp }}/md-bookmark-unsaved.xml
            ${{ runner.temp }}/md-bookmark-unsaved.png
            ${{ runner.temp }}/md-workspace-reopen.xml
            ${{ runner.temp }}/md-favorites-empty.xml
            ${{ runner.temp }}/md-favorites-empty.png
            ${{ runner.temp }}/md-storage-entry.xml
            ${{ runner.temp }}/md-storage-status.xml
            ${{ runner.temp }}/md-storage-status.png
          if-no-files-found: ignore
          retention-days: 7
